apiVersion: v1
kind: ConfigMap
metadata:
  name: classroom-config
  namespace: classroom-studio
data:
  APP_ENV: production
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: s3
  S3_REGION: us-east-1
  S3_BUCKET: classroom-files
  S3_FORCE_PATH_STYLE: "false"
  ALLOWED_ORIGINS: https://classroom.example.com
  EXPORTER_URL: http://exporter:8082
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_MODEL: qwen3:1.7b
  OLLAMA_NUM_CTX: "16384"
  MAX_MODEL_INPUT_CHARS: "24000"
  ACCESS_TOKEN_MINUTES: "30"
  REFRESH_TOKEN_DAYS: "14"
  UPLOAD_RETENTION_DAYS: "30"
